<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>

    <h2>Formulario de Registro</h2>

    <form action="#" method="POST">
        <!-- Campo Nombre -->
        <label for="nombre">Nombre completo:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required><br><br>

        <!-- Campo Edad -->
        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ej. 20" required><br><br>

        <!-- Campo Cumpleaños -->
        <label for="cumpleanos">Fecha de Cumpleaños:</label><br>
        <input type="date" id="cumpleanos" name="cumpleanos" required><br><br>

        <!-- Botón de Envío -->
        <button type="submit">Registrar</button>
    </form>


</body>
</html>
